<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d1110">
    <meta name="description" content="DimOS — 16-битная система, которая запускается прямо в браузере.">
    <title>DimOS — запуск в браузере</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0d1110;
            --panel: #131a17;
            --line: #223029;
            --text: #eaf4ee;
            --muted: #8da398;
            --accent: #3ddc84;
            --accent-dim: #173526;
            --danger: #ff8f8f;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        button {
            font: inherit;
            color: inherit;
            touch-action: manipulation;
        }

        .page {
            width: min(760px, calc(100% - 24px));
            margin: 0 auto;
            padding: 16px 0 40px;
        }

        .top {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 2px 16px;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: -0.02em;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 30px;
            height: 30px;
            border: 1px solid var(--accent);
            border-radius: 8px;
            color: var(--accent);
            background: var(--accent-dim);
            font: 700 15px/1 ui-monospace, Consolas, monospace;
        }

        .tag {
            color: var(--muted);
            font-size: 13px;
        }

        .machine {
            margin-top: 18px;
        }

        .screen-wrap {
            position: relative;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            background: #000;
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
            outline: none;
        }

        .screen-wrap:focus-visible {
            border-color: var(--accent);
        }

        .placeholder {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: grid;
            place-content: center;
            justify-items: center;
            gap: 12px;
            color: var(--muted);
            background: #000;
            font-size: 14px;
            pointer-events: none;
        }

        .spinner {
            width: 26px;
            height: 26px;
            border: 3px solid var(--line);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .status {
            margin: 12px 2px 0;
            min-height: 1.4em;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
        }

        .status[data-tone="ready"] {
            color: var(--accent);
        }

        .status[data-tone="error"] {
            color: var(--danger);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }

        .controls button {
            padding: 8px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            cursor: pointer;
        }

        .controls button:hover:not(:disabled) {
            border-color: var(--accent);
        }

        .controls button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        .keys {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: 10px;
        }

        .keys button {
            min-width: 44px;
            padding: 8px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            color: var(--text);
            font: 600 13px/1 ui-monospace, Consolas, monospace;
            cursor: pointer;
        }

        .keys button:hover:not(:disabled) {
            border-color: var(--accent);
        }

        .keys button:disabled {
            opacity: 0.45;
            cursor: default;
        }

        .keys .snake-key {
            border-color: var(--accent);
            background: var(--accent-dim);
            color: var(--accent);
        }

        .note {
            margin: 22px 2px 0;
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="top">
            <span class="brand"><span class="brand-mark">D</span>DimOS</span>
            <span class="tag">16-битная ОС · запуск в браузере</span>
        </header>

        <main class="machine">
            <div class="screen-wrap" id="screenViewport" tabindex="0" aria-label="Экран DimOS">
                <div id="screen_container"></div>
                <div class="placeholder" id="bootPlaceholder">
                    <div class="spinner"></div>
                    <div>Загружаю DimOS…</div>
                </div>
            </div>

            <div class="status" id="statusText" data-tone="loading">Готовлю запуск…</div>

            <div class="controls" id="vmActions">
                <button type="button" id="pauseButton" disabled>Пауза</button>
                <button type="button" id="restartButton" disabled>Перезапуск</button>
                <button type="button" id="fullscreenButton" disabled>На весь экран</button>
                <button type="button" id="changeButton" disabled>Другой ISO</button>
            </div>

            <div class="keys" id="vmKeys">
                <button class="snake-key" type="button" data-action="snake" disabled>SNAKE ↵</button>
                <button type="button" data-scan="30" aria-label="Влево" disabled>◀</button>
                <button type="button" data-scan="17" aria-label="Вверх" disabled>▲</button>
                <button type="button" data-scan="31" aria-label="Вниз" disabled>▼</button>
                <button type="button" data-scan="32" aria-label="Вправо" disabled>▶</button>
                <button type="button" data-scan="49" disabled>N</button>
                <button type="button" data-scan="1" disabled>ESC</button>
            </div>

            <p class="note">dimos.iso встроен в страницу и запускается сразу. Можно загрузить и другой образ — но только в формате ISO. Файл читается локально браузером и никуда не отправляется.</p>
        </main>
    </div>

    <input type="file" id="isoFile" accept=".iso,application/x-iso9660-image" hidden>

    <script src="./web/v86/libv86.js"></script>
    <script>
        "use strict";

        const BUNDLED_ISO = "./web/dimos.iso";
        const OPENED_AS_LOCAL_FILE = window.location.protocol === "file:";

        const isoFileInput = document.getElementById("isoFile");
        const screenViewport = document.getElementById("screenViewport");
        const screenContainer = document.getElementById("screen_container");
        const bootPlaceholder = document.getElementById("bootPlaceholder");
        const statusText = document.getElementById("statusText");
        const pauseButton = document.getElementById("pauseButton");
        const restartButton = document.getElementById("restartButton");
        const fullscreenButton = document.getElementById("fullscreenButton");
        const changeButton = document.getElementById("changeButton");
        const vmActions = document.querySelectorAll("#vmActions button");
        const vmKeys = document.querySelectorAll("#vmKeys button");

        let emulator = null;
        let paused = false;
        let booting = false;
        let currentName = "dimos.iso";

        function setStatus(message, tone) {
            statusText.textContent = message;
            statusText.dataset.tone = tone || "loading";
        }

        function setControlsEnabled(enabled) {
            vmActions.forEach(button => { button.disabled = !enabled; });
            vmKeys.forEach(button => { button.disabled = !enabled; });
        }

        function resetScreen() {
            const textScreen = document.createElement("div");
            const canvas = document.createElement("canvas");
            canvas.style.display = "none";
            screenContainer.replaceChildren(textScreen, canvas);
            bootPlaceholder.hidden = false;
        }

        async function destroyEmulator() {
            if (!emulator) return;
            const old = emulator;
            emulator = null;
            window.emulator = null;
            try { await old.stop(); } catch (error) { console.debug(error); }
            try { await old.destroy(); } catch (error) { console.debug(error); }
        }

        function fitScreen() {
            if (!emulator) return;
            const available = Math.max(240, screenViewport.clientWidth - 2);
            const scale = Math.min(1, available / 720);
            try {
                emulator.screen_set_scale(scale, scale);
            } catch (error) {
                console.debug(error);
            }
        }

        async function bootIso(buffer, name) {
            if (booting) return;
            booting = true;
            setControlsEnabled(false);
            paused = false;
            pauseButton.textContent = "Пауза";
            setStatus("Загружаю " + name + "…");

            try {
                if (typeof window.V86 !== "function") {
                    throw new Error("Движок v86 не загрузился.");
                }

                await destroyEmulator();
                resetScreen();

                emulator = new window.V86({
                    wasm_path: "./web/v86/v86.wasm",
                    memory_size: 32 * 1024 * 1024,
                    vga_memory_size: 4 * 1024 * 1024,
                    screen_container: screenContainer,
                    bios: { url: "./web/v86/seabios.bin" },
                    vga_bios: { url: "./web/v86/vgabios.bin" },
                    cdrom: { buffer },
                    boot_order: 0x213, // сначала CD-ROM
                    autostart: true,
                    fastboot: true,
                    disable_mouse: true,
                    disable_speaker: true
                });
                window.emulator = emulator;

                emulator.add_listener("download-progress", event => {
                    if (!event.lengthComputable || !event.total) return;
                    setStatus("Загрузка движка: " + Math.round(event.loaded / event.total * 100) + "%");
                });

                emulator.add_listener("download-error", () => {
                    setStatus("Не удалось загрузить компоненты движка", "error");
                });

                emulator.add_listener("emulator-ready", () => {
                    bootPlaceholder.hidden = true;
                    setControlsEnabled(true);
                    setStatus(currentName === "dimos.iso"
                        ? "DimOS запущена. Введи SNAKE или нажми зелёную кнопку."
                        : "Запущен " + currentName + ".", "ready");
                    fitScreen();
                    screenViewport.focus({ preventScroll: true });
                });

                emulator.add_listener("emulator-stopped", () => {
                    if (emulator && paused) setStatus("Пауза");
                });
            } catch (error) {
                console.error(error);
                bootPlaceholder.hidden = true;
                setStatus(error.message || "Не удалось запустить DimOS", "error");
                setControlsEnabled(true);
            } finally {
                booting = false;
            }
        }

        async function startBundledIso() {
            setStatus("Загружаю встроенный dimos.iso…");
            try {
                const response = await fetch(BUNDLED_ISO);
                if (!response.ok) throw new Error("HTTP " + response.status);
                const buffer = await response.arrayBuffer();
                if (buffer.byteLength === 0) throw new Error("Пустой файл");
                currentName = "dimos.iso";
                await bootIso(buffer, currentName);
            } catch (error) {
                console.error(error);
                if (OPENED_AS_LOCAL_FILE) {
                    setStatus("Страница открыта как локальный файл — запусти веб-сервер (python3 -m http.server) или выбери свой ISO.", "error");
                } else {
                    setStatus("Не нашёл встроенный dimos.iso. Выбери свой ISO-файл.", "error");
                }
                setControlsEnabled(true);
            }
        }

        function isIsoName(name) {
            return name.toLowerCase().endsWith(".iso");
        }

        isoFileInput.addEventListener("change", async () => {
            const file = isoFileInput.files[0];
            isoFileInput.value = "";
            if (!file) return;
            if (!isIsoName(file.name)) {
                setStatus("Поддерживаются только файлы ISO. " + file.name + " пропущен.", "error");
                return;
            }
            currentName = file.name;
            await bootIso(await file.arrayBuffer(), file.name);
        });

        pauseButton.addEventListener("click", async () => {
            if (!emulator) return;
            try {
                if (paused) {
                    await emulator.run();
                    paused = false;
                    pauseButton.textContent = "Пауза";
                    setStatus(currentName === "dimos.iso" ? "DimOS запущена." : "Запущен " + currentName + ".", "ready");
                } else {
                    paused = true;
                    await emulator.stop();
                    pauseButton.textContent = "Продолжить";
                    setStatus("Пауза");
                }
            } catch (error) {
                console.error(error);
                setStatus("Не удалось изменить состояние", "error");
            }
        });

        restartButton.addEventListener("click", () => {
            if (!emulator) return;
            paused = false;
            pauseButton.textContent = "Пауза";
            emulator.restart();
            setStatus("Перезапуск…");
        });

        fullscreenButton.addEventListener("click", async () => {
            if (!emulator) return;
            try {
                emulator.screen_go_fullscreen();
            } catch (error) {
                if (screenViewport.requestFullscreen) await screenViewport.requestFullscreen();
            }
        });

        changeButton.addEventListener("click", () => {
            isoFileInput.click();
        });

        screenViewport.addEventListener("pointerdown", () => {
            if (!emulator) return;
            emulator.keyboard_set_enabled(true);
            screenViewport.focus({ preventScroll: true });
        });

        function sendScanCode(code) {
            if (!emulator) return;
            emulator.keyboard_send_scancodes([code, code | 0x80]);
            screenViewport.focus({ preventScroll: true });
        }

        vmKeys.forEach(button => {
            button.addEventListener("pointerdown", event => {
                event.preventDefault();
                if (!emulator) return;

                if (button.dataset.action === "snake") {
                    emulator.keyboard_send_text("SNAKE");
                    window.setTimeout(() => sendScanCode(0x1C), 80);
                    return;
                }

                sendScanCode(Number(button.dataset.scan));
            });
        });

        window.addEventListener("resize", fitScreen);
        window.addEventListener("unhandledrejection", event => {
            if (!emulator) return;
            console.error(event.reason);
            setStatus("Ошибка. Попробуй перезапустить страницу.", "error");
        });

        startBundledIso();
    </script>
</body>
</html>
