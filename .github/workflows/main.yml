name: Build and validate DimOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dimos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate bootable images
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            binutils \
            dosfstools \
            mtools \
            nasm \
            qemu-system-x86 \
            python3-venv \
            xorriso \
            zip

      - name: Build PC profile
        run: |
          make clean
          make iso
          mkdir -p release/PC
          cp disk_img/dimos.iso disk_img/dimos.img disk_img/dimos.hdd release/PC/

      - name: Validate PC profile
        run: make verify

      - name: Build emulator profile
        run: |
          make clean
          make emulator
          mkdir -p release/Emulator
          cp disk_img/dimos.iso disk_img/dimos.img disk_img/dimos.hdd release/Emulator/

      - name: Validate emulator profile
        run: make verify

      - name: Boot PC profile in QEMU
        run: |
          status=0
          timeout 10s qemu-system-x86_64 \
            -machine pc,accel=tcg -m 32M \
            -drive file=release/PC/dimos.hdd,format=raw,if=ide \
            -boot c -display none -serial none -monitor none \
            -no-reboot -no-shutdown -debugcon file:qemu-debug.log || status=$?
          test "$status" -eq 124
          grep -F "DIMOS:PROTECTED" qemu-debug.log
          grep -F "DIMOS:READY:VBE" qemu-debug.log

      # The sandbox runs the real kernel against a fake PC, so the phone
      # shell can be exercised (and screenshotted) on a build machine.
      - name: Phone shell smoke test
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet unicorn pillow
          /tmp/venv/bin/python tools/sandbox/run_kernel.py --build
          /tmp/venv/bin/python tools/sandbox/run_kernel.py --frames 90
          test -s tools/sandbox/out/kernel.bin

      - name: Assemble the browser package
        run: |
          make clean
          make emulator
          mkdir -p web/dist
          cp web/index.html web/dist/
          cp disk_img/dimos.img web/dist/dimos.img
          cp disk_img/dimos.iso web/dist/dimos.iso

      - name: Upload browser package
        uses: actions/upload-artifact@v6
        with:
          name: DimOS-web
          path: web/dist
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

      - name: Create DimOS zip package
        run: |
          (cd release && zip -qr "../DimOS-${{ github.sha }}.zip" PC Emulator)

      - name: Upload DimOS package
        uses: actions/upload-artifact@v6
        with:
          name: DimOS-${{ github.sha }}
          path: DimOS-${{ github.sha }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
