name: Build Sokol OS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sokolos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux -- build, screenshots, window under Xvfb
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            xvfb \
            imagemagick

      - name: Build the application
        run: |
          set +e
          mkdir -p build
          make app 2>&1 | tee build/app.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "error|undefined reference" build/app.log | head -25 |
              while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            exit "$rc"
          fi

      - name: Render the screenshots headlessly
        run: make check

      - name: Upload the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sokol-os-frames
          path: build/frames/*.png
          if-no-files-found: error

      - name: Smoke-test the real window in a virtual X server
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            ./bin/sokol-os > build/xvfb.log 2>&1 &
            app=$!
            sleep 8
            if kill -0 "$app" 2>/dev/null; then
              kill "$app"; wait "$app" 2>/dev/null
              echo "sokol-os stayed alive for 8s"
              import -window root build/xvfb-window.png
              exit 0
            fi
            echo "sokol-os exited early"
            exit 1
          '
          rc=$?
          echo "---- sokol-os log ----"
          cat build/xvfb.log || true
          echo "---- glxinfo ----"
          xvfb-run -a glxinfo -B 2>&1 | head -20 || true
          if [ "$rc" -ne 0 ]; then
            head -20 build/xvfb.log | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            exit 1
          fi

      - name: Upload the window screenshot
        uses: actions/upload-artifact@v4
        with:
          name: sokol-os-window
          path: |
            build/xvfb-window.png
            build/xvfb.log
          if-no-files-found: warn

  macos:
    name: macOS -- compile check
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the application
        run: |
          set +e
          mkdir -p build
          make app 2>&1 | tee build/app.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "error|undefined reference" build/app.log | head -25 |
              while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            exit "$rc"
          fi
      - run: make frames
      - uses: actions/upload-artifact@v4
        with:
          name: sokol-os-frames-macos
          path: build/frames/*.png
          if-no-files-found: error

  windows:
    name: Windows -- compile check
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build with MSVC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build, bin | Out-Null
          python tools/embed_font.py fonts/font.ttf build/font_data.h
          $out = cl /nologo /O2 /W3 /Isrc /Ithird_party/sokol /Ithird_party/stb /Ibuild `
             src/app.c src/snake.c src/draw.c src/platform_sokol.c `
             /Fe:bin/sokol-os.exe /Fo:build/ `
             opengl32.lib user32.lib gdi32.lib shell32.lib ole32.lib 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) {
            $out -split "`n" | Where-Object { $_ -match "error" } | Select-Object -First 25 |
              ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }
      - name: Render the screenshots headlessly
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/frames | Out-Null
          cl /nologo /O2 /W3 /Isrc /Ithird_party/sokol /Ithird_party/stb /Ibuild `
             tools/render_frames.c src/app.c src/snake.c src/draw.c `
             /Fe:bin/render-frames.exe 2>&1 | Out-String | Write-Output
          if (-not (Test-Path bin/render-frames.exe)) { Write-Output "::error::render-frames.exe was not built"; exit 1 }
          .\bin\render-frames.exe fonts/font.ttf build/frames
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::render-frames exited with $LASTEXITCODE"; exit 1 }
          Get-ChildItem build/frames
      - uses: actions/upload-artifact@v4
        with:
          name: sokol-os-frames-windows
          path: build/frames/*.png
          if-no-files-found: error
