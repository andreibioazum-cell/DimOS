name: Build DimOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dimos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: Live ISO + IMG (archiso)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install toolchain
        run: |
          pacman -Syu --noconfirm --needed \
            archiso base-devel python libx11 libxi libxcursor mesa

      - name: Build ISO and IMG
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./iso/build-iso.sh 2>&1 | tee iso/build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          tail -40 iso/build.log 2>/dev/null | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-3000 |
            sed 's/^/::error title=build tail::/'
          echo
          grep -iE 'error|failed|not found|unable|could not|target not found' iso/build.log 2>/dev/null |
            head -30 | tr '\n' ' ' | cut -c1-3000 | sed 's/^/::error title=build errors::/'
          echo

      - name: Checksums
        if: success()
        run: |
          cd dist
          sha256sum dimos.iso dimos.img > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload ISO and IMG
        uses: actions/upload-artifact@v6
        with:
          name: dimos-x86_64
          path: |
            dist/dimos.iso
            dist/dimos.img
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    name: Linux -- build and run the desktop program
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            xvfb

      - name: Build the application
        run: |
          set +e
          mkdir -p build
          make app 2>&1 | tee build/app.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "error|undefined reference" build/app.log | head -25 |
              while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            exit "$rc"
          fi

      - name: Smoke-test the real window in a virtual X server
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          set +e
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            ./bin/dimos > build/xvfb.log 2>&1 &
            app=$!
            sleep 8
            if kill -0 "$app" 2>/dev/null; then
              kill "$app"; wait "$app" 2>/dev/null
              echo "dimos stayed alive for 8s"
              exit 0
            fi
            echo "dimos exited early"
            exit 1
          '
          rc=$?
          echo "---- dimos log ----"
          cat build/xvfb.log || true
          if [ "$rc" -ne 0 ]; then
            head -20 build/xvfb.log | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            exit 1
          fi

  macos:
    name: macOS -- compile check
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make app

  windows:
    name: Windows -- compile check
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build with MSVC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build, bin | Out-Null
          python tools/embed_font.py fonts/font.ttf build/font_data.h
          $out = cl /nologo /O2 /W3 /Isrc /Ithird_party/sokol /Ithird_party/stb /Ibuild `
             src/app.c src/snake.c src/draw.c src/platform_sokol.c `
             /Fe:bin/dimos.exe /Fo:build/ `
             opengl32.lib user32.lib gdi32.lib shell32.lib ole32.lib 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -ne 0) {
            $out -split "`n" | Where-Object { $_ -match "error" } | Select-Object -First 25 |
              ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }
