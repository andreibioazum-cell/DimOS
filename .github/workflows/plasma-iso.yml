name: Build DimOS Snake ISO (x86_64)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "plasma/**"
      - ".github/workflows/plasma-iso.yml"

permissions:
  contents: read

jobs:
  iso:
    name: Build archiso image (Snake)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install archiso
        run: |
          pacman -Sy --noconfirm archiso

      - name: Compile Snake
        run: |
          pacman -Sy --noconfirm gcc
          gcc -std=c11 -Wall -Wextra -Werror -O2 -o plasma/archiso/airootfs/usr/local/bin/snake plasma/snake/snake.c

      - name: Build ISO
        id: build
        working-directory: plasma
        shell: bash
        run: |
          set -o pipefail
          pacman -Sy --noconfirm
          pacman -Si plasma-desktop | head -3
          ./build-iso.sh 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        working-directory: plasma
        run: |
          tail -40 build.log 2>/dev/null | tr '\n' ' ' | sed 's/  */ /g' | cut -c1-3000 | sed 's/^/::error title=build tail::/'
          echo
          grep -iE 'error|failed|not found|unable|could not|target not found' build.log 2>/dev/null | head -30 | tr '\n' ' ' | cut -c1-3000 | sed 's/^/::error title=build errors::/'
          echo

      - name: Upload ISO
        uses: actions/upload-artifact@v6
        with:
          name: dimos-plasma-x86_64
          path: plasma/out/*.iso
          if-no-files-found: error
          retention-days: 14
