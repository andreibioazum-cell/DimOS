# Initramfs for a machine that must reach the desktop as fast as possible.
#
# COMPRESSION=zstd, not xz: zstd decompresses at hundreds of MB/s while xz
# needs seconds per megabyte on an emulated CPU (and the live image is often
# booted in one). The level only affects the build, never the boot.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-T0 -19)

# Trimmed hook list: no microcode, no PXE network hooks, no keyboard maps.
# The archiso hook brings its own modules (iso9660, squashfs, loop, overlay).
HOOKS=(base udev modconf memdisk archiso archiso_loop_mnt block filesystems)
