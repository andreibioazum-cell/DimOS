<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>DimOS 14 · pocket iPhone-style OS</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f5f7;
      --muted: #8e8e93;
      --blue: #0a84ff;
      --green: #30d158;
      --glass: rgba(28, 28, 30, .72);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, ui-sans-serif, system-ui, sans-serif;
      background: #000;
      color: var(--ink);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #000;
      overscroll-behavior: none;
      touch-action: manipulation;
      user-select: none; -webkit-user-select: none;
    }
    #app { position: fixed; inset: 0; display: grid; place-items: center; }

    /* The emulator screen fills the phone. Letterboxing is done by the
       kernel's own presenter, which keeps the iPhone proportions. */
    #screen_container { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; background: #000; }
    #screen_container canvas, #screen_container .screen {
      width: 100%; height: 100%; object-fit: contain;
      image-rendering: auto; touch-action: none;
    }
    #screen_container .screen { font: 12px/12px ui-monospace, monospace; white-space: pre; color: #ddd; }

    /* The boot cover: shown before the emulator has a first frame. */
    #boot {
      position: absolute; inset: 0; display: grid; place-content: center; justify-items: center;
      gap: 18px; background: #000; transition: opacity .6s ease; z-index: 4;
    }
    #boot.hidden { opacity: 0; pointer-events: none; }
    .mark {
      width: 84px; height: 84px; border-radius: 24px;
      display: grid; place-items: center;
      background: linear-gradient(160deg, #5ac8fa, #0a84ff 45%, #af52de);
      box-shadow: 0 18px 60px rgba(10, 132, 255, .45);
      font-size: 44px; font-weight: 700; letter-spacing: -.04em; color: #fff;
    }
    .boot-title { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
    .boot-sub { color: var(--muted); font-size: 13px; text-align: center; max-width: 300px; line-height: 1.5; }
    .bar { width: 168px; height: 4px; border-radius: 2px; background: #2c2c2e; overflow: hidden; }
    .bar > i { display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--ink); animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }

    /* Buttons float over the screen like the assistive-touch bubble. */
    #tools {
      position: absolute; right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: flex-end; gap: 10px; z-index: 5;
    }
    .bubble {
      width: 44px; height: 44px; border-radius: 22px; border: 0;
      background: rgba(58, 58, 60, .55); color: var(--ink);
      backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
      box-shadow: 0 6px 24px rgba(0,0,0,.45), inset 0 0 0 .5px rgba(255,255,255,.18);
      font-size: 19px; display: grid; place-items: center; padding: 0;
    }
    .bubble:active { transform: scale(.94); }
    .bubble.off { opacity: .35; }

    /* The on-screen keyboard: only needed for the terminal, so it is a
       slide-up sheet with real scancodes. */
    #keyboard {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
      padding: 10px max(10px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-bottom));
      background: rgba(28, 28, 30, .92);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      transform: translateY(110%); transition: transform .28s ease;
      display: grid; gap: 6px;
    }
    #keyboard.up { transform: translateY(0); }
    .krow { display: grid; grid-auto-flow: column; gap: 6px; justify-content: center; }
    .key {
      min-width: 30px; height: 40px; padding: 0 9px; border: 0; border-radius: 7px;
      background: #636366; color: #fff; font-size: 16px; font-weight: 500; font-family: inherit;
    }
    .key.wide { min-width: 52px; background: #48484a; font-size: 13px; }
    .key.blue { background: var(--blue); }
    .key:active { background: #8e8e93; }

    /* Portrait phones get a rotate hint, because the shell is a landscape
       iPhone screen; laptops and tablets never see it. */
    #rotate {
      position: absolute; inset: 0; z-index: 7; display: none;
      place-content: center; justify-items: center; gap: 14px; text-align: center;
      background: #000; padding: 28px;
    }
    #rotate .phone {
      width: 74px; height: 128px; border: 3px solid var(--ink); border-radius: 16px;
      animation: turn 2.4s ease-in-out infinite;
    }
    @keyframes turn { 0%, 30% { transform: rotate(0); } 55%, 100% { transform: rotate(90deg); } }
    @media (orientation: portrait) and (max-width: 820px) {
      #rotate { display: grid; }
    }
    #hint {
      position: absolute; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%);
      padding: 7px 14px; border-radius: 999px; background: rgba(0,0,0,.55);
      color: #d7d7dc; font-size: 12px; z-index: 5; pointer-events: none;
      opacity: 0; transition: opacity .3s;
    }
    #hint.show { opacity: 1; }
    input[type=file] { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <div id="screen_container">
      <div class="screen"></div>
      <canvas style="display:none"></canvas>
    </div>

    <div id="boot">
      <div class="mark">D</div>
      <div class="boot-title">DimOS 14</div>
      <div class="bar"><i></i></div>
      <div class="boot-sub" id="boot-note">Booting the pocket OS…</div>
    </div>

    <div id="hint"></div>

    <div id="tools">
      <button class="bubble" id="keyboard-toggle" title="On-screen keyboard">⌨︎</button>
      <button class="bubble" id="fullscreen-toggle" title="Fullscreen">⤢</button>
      <button class="bubble" id="reload-toggle" title="Restart DimOS">⟳</button>
      <button class="bubble" id="image-toggle" title="Load another disk image">⤓</button>
    </div>
    <input id="image" type="file" accept=".img,.hdd,application/octet-stream">

    <div id="keyboard">
      <div class="krow" data-row="1234567890"></div>
      <div class="krow" data-row="qwertyuiop"></div>
      <div class="krow" data-row="asdfghjkl"></div>
      <div class="krow">
        <button class="key wide" data-key="shift">shift</button>
        <button class="key" data-key="z">z</button>
        <button class="key" data-key="x">x</button>
        <button class="key" data-key="c">c</button>
        <button class="key" data-key="v">v</button>
        <button class="key" data-key="b">b</button>
        <button class="key" data-key="n">n</button>
        <button class="key" data-key="m">m</button>
        <button class="key" data-key=",">,</button>
        <button class="key" data-key=".">.</button>
        <button class="key wide" data-key="backspace">⌫</button>
      </div>
      <div class="krow">
        <button class="key wide" data-key=" ">space</button>
        <button class="key wide blue" data-key="enter">return</button>
        <button class="key wide" data-key="escape">esc</button>
      </div>
    </div>

    <div id="rotate">
      <div class="phone"></div>
      <div class="boot-title">Turn the phone</div>
      <div class="boot-sub">DimOS is a landscape pocket OS, like a phone held sideways. Rotate the device or open it on a desktop browser.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/v86@0.5.471/build/libv86.js"></script>
  <script>
    (() => {
      const V86_VERSION = '0.5.471';
      const BUILT_IN_IMAGE = 'dimos.img';   // shipped next to this page
      const el = (id) => document.getElementById(id);
      const screenContainer = el('screen_container');
      const boot = el('boot');
      const bootNote = el('boot-note');
      const hint = el('hint');

      let emulator = null;
      let starting = false;
      let shift = false;
      let hintTimer = 0;

      const SCAN = {
        '1': 0x02, '2': 0x03, '3': 0x04, '4': 0x05, '5': 0x06, '6': 0x07,
        '7': 0x08, '8': 0x09, '9': 0x0A, '0': 0x0B, '-': 0x0C, '=': 0x0D,
        'q': 0x10, 'w': 0x11, 'e': 0x12, 'r': 0x13, 't': 0x14, 'y': 0x15,
        'u': 0x16, 'i': 0x17, 'o': 0x18, 'p': 0x19, '[': 0x1A, ']': 0x1B,
        'a': 0x1E, 's': 0x1F, 'd': 0x20, 'f': 0x21, 'g': 0x22, 'h': 0x23,
        'j': 0x24, 'k': 0x25, 'l': 0x26, ';': 0x27, "'": 0x28, '`': 0x29,
        'z': 0x2C, 'x': 0x2D, 'c': 0x2E, 'v': 0x2F, 'b': 0x30, 'n': 0x31,
        'm': 0x32, ',': 0x33, '.': 0x34, '/': 0x35, ' ': 0x39
      };
      const SPECIAL = { backspace: 0x0E, enter: 0x1C, escape: 0x01, shift: 0x2A,
                        up: 0x48, down: 0x50, left: 0x4B, right: 0x4D };

      function toast(text) {
        hint.textContent = text;
        hint.classList.add('show');
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => hint.classList.remove('show'), 2200);
      }

      function resetScreen() {
        screenContainer.innerHTML =
          '<div class="screen"></div><canvas style="display:none"></canvas>';
      }

      function stopEmulator() {
        if (emulator) {
          try { emulator.destroy(); } catch (_) {}
          emulator = null;
        }
        resetScreen();
      }

      async function startEmulator(source) {
        if (starting) return;
        starting = true;
        stopEmulator();
        boot.classList.remove('hidden');
        bootNote.textContent = 'Booting the pocket OS…';
        try {
          let disk;
          if (source) {
            disk = { hda: { buffer: source } };
          } else {
            const response = await fetch(BUILT_IN_IMAGE, { cache: 'no-cache' });
            if (!response.ok) throw new Error('no image');
            disk = { fda: { buffer: new Uint8Array(await response.arrayBuffer()) } };
          }
          emulator = new V86({
            wasm_path: `https://cdn.jsdelivr.net/npm/v86@${V86_VERSION}/build/v86.wasm`,
            bios: { url: 'https://cdn.jsdelivr.net/gh/copy/v86@94faf3d6b19ecabc53a4010aaa24252fa6a162e2/bios/seabios.bin' },
            vga_bios: { url: 'https://cdn.jsdelivr.net/gh/copy/v86@94faf3d6b19ecabc53a4010aaa24252fa6a162e2/bios/vgabios.bin' },
            memory_size: 64 * 1024 * 1024,
            // 844x390 XRGB8888 needs 1.3 MB; 16 MB leaves room for a
            // 1024x768 phone-emulator surface with double buffering.
            vga_memory_size: 16 * 1024 * 1024,
            screen_container: screenContainer,
            autostart: true,
            disable_speaker: false,
            ...disk
          });
          emulator.add_listener('emulator-ready', () => {
            boot.classList.add('hidden');
            toast('Tap the screen to wake the phone');
          });
          emulator.add_listener('emulator-stopped', () => {
            bootNote.textContent = 'The emulator stopped. Tap ⟳ to boot again.';
            boot.classList.remove('hidden');
          });
        } catch (error) {
          console.error(error);
          bootNote.textContent =
            'Could not load the demo image. Put dimos.img next to this page, ' +
            'or open one with ⤓.';
        } finally {
          starting = false;
        }
      }

      // --- keyboard ------------------------------------------------------
      function sendKey(name) {
        if (!emulator) return;
        if (name === 'shift') {
          shift = !shift;
          document.querySelectorAll('[data-key="shift"]').forEach(
            (key) => key.classList.toggle('blue', shift));
          return;
        }
        const code = SPECIAL[name] !== undefined ? SPECIAL[name] : SCAN[name];
        if (code === undefined) return;
        let make = code;
        if (shift && name.length === 1) {
          emulator.keyboard_send_scancodes([0x2A, make, make | 0x80, 0xAA]);
        } else {
          emulator.keyboard_send_scancodes([make, make | 0x80]);
        }
      }

      document.querySelectorAll('.krow[data-row]').forEach((row) => {
        row.dataset.row.split('').forEach((letter) => {
          const key = document.createElement('button');
          key.className = 'key';
          key.textContent = letter;
          key.dataset.key = letter;
          row.appendChild(key);
        });
      });
      document.querySelectorAll('.key[data-key]').forEach((key) => {
        key.addEventListener('click', () => sendKey(key.dataset.key));
      });
      el('keyboard-toggle').addEventListener('click', () => {
        el('keyboard').classList.toggle('up');
      });

      // --- host keyboard, for desktop browsers --------------------------
      window.addEventListener('keydown', (event) => {
        const name = event.key === 'Enter' ? 'enter'
          : event.key === 'Backspace' ? 'backspace'
          : event.key === 'Escape' ? 'escape'
          : event.key === 'ArrowUp' ? 'up'
          : event.key === 'ArrowDown' ? 'down'
          : event.key === 'ArrowLeft' ? 'left'
          : event.key === 'ArrowRight' ? 'right'
          : event.key.length === 1 ? event.key.toLowerCase() : null;
        if (!name) return;
        shift = event.shiftKey;
        sendKey(name);
        if (event.key.startsWith('Arrow') || event.key === ' ') event.preventDefault();
      });

      // --- fullscreen, restart, image ----------------------------------
      el('fullscreen-toggle').addEventListener('click', async () => {
        try {
          if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) {
              try { await screen.orientation.lock('landscape'); } catch (_) {}
            }
          } else {
            await document.exitFullscreen();
          }
        } catch (_) { toast('Fullscreen is not available here'); }
      });
      el('reload-toggle').addEventListener('click', () => startEmulator());
      el('image-toggle').addEventListener('click', () => el('image').click());
      el('image').addEventListener('change', async () => {
        const file = el('image').files && el('image').files[0];
        if (!file) return;
        startEmulator(new Uint8Array(await file.arrayBuffer()));
      });

      // Touch scrolling must never move the page under the emulator.
      document.addEventListener('touchmove', (event) => event.preventDefault(),
                                { passive: false });

      startEmulator();
    })();
  </script>
</body>
</html>
