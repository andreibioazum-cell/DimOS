name: Build and validate DimOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dimos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate bootable images
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            binutils \
            dosfstools \
            mtools \
            nasm \
            xorriso

      - name: Build bootable images
        run: make iso

      - name: Validate bootable images
        run: make verify

      - name: Create checksums
        run: |
          cd disk_img
          sha256sum dimos.iso dimos.img dimos.hdd > SHA256SUMS

      - name: Upload DimOS package
        uses: actions/upload-artifact@v6
        with:
          name: DimOS-${{ github.sha }}
          path: |
            disk_img/dimos.iso
            disk_img/dimos.img
            disk_img/dimos.hdd
            disk_img/SHA256SUMS
            README.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
