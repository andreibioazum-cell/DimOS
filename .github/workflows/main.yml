name: Build Sokol OS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sokolos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux -- build, screenshots, window under Xvfb
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and window dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            xvfb \
            imagemagick

      - name: Build the application
        run: make app

      - name: Render the screenshots headlessly
        run: make check

      - name: Upload the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sokol-os-frames
          path: build/frames/*.png
          if-no-files-found: error

      - name: Smoke-test the real window in a virtual X server
        run: |
          set -o pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            ./bin/sokol-os > build/xvfb.log 2>&1 &
            app=$!
            sleep 7
            if ! kill -0 "$app" 2>/dev/null; then
              echo "sokol-os exited early:"; cat build/xvfb.log; exit 1
            fi
            import -window root build/xvfb-window.png || true
            kill "$app"
            wait "$app" 2>/dev/null || true
          '
          cat build/xvfb.log

      - name: Upload the window screenshot
        uses: actions/upload-artifact@v4
        with:
          name: sokol-os-window
          path: |
            build/xvfb-window.png
            build/xvfb.log
          if-no-files-found: warn

  macos:
    name: macOS -- compile check
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make app
      - run: make frames
      - uses: actions/upload-artifact@v4
        with:
          name: sokol-os-frames-macos
          path: build/frames/*.png
          if-no-files-found: error

  windows:
    name: Windows -- compile check
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build with MSVC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build, bin | Out-Null
          python tools/embed_font.py fonts/font.ttf build/font_data.h
          cl /nologo /O2 /W3 /Isrc /Ithird_party/sokol /Ithird_party/stb /Ibuild `
             src/app.c src/snake.c src/draw.c src/platform_sokol.c `
             /Fe:bin/sokol-os.exe /Fo:build/ `
             opengl32.lib user32.lib gdi32.lib shell32.lib ole32.lib
      - name: Render the screenshots headlessly
        shell: pwsh
        run: |
          cl /nologo /O2 /W3 /Isrc /Ithird_party/sokol /Ithird_party/stb /Ibuild `
             tools/render_frames.c src/app.c src/snake.c src/draw.c `
             /Fe:bin/render-frames.exe /Fo:build/render- `
          New-Item -ItemType Directory -Force -Path build/frames | Out-Null
          .\bin\render-frames.exe fonts/font.ttf build/frames
      - uses: actions/upload-artifact@v4
        with:
          name: sokol-os-frames-windows
          path: build/frames/*.png
          if-no-files-found: error
