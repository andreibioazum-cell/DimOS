name: Build bootable ISO

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate DimOS
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            dosfstools \
            mtools \
            nasm \
            xorriso

      - name: Build bootable images
        run: make iso

      - name: Validate artifacts
        run: make verify

      - name: Create checksums
        run: |
          cd disk_img
          sha256sum dimos.iso dimos.img FLOPPY2.img > SHA256SUMS

      - name: Upload boot images
        uses: actions/upload-artifact@v4
        with:
          name: DimOS-${{ github.sha }}
          path: |
            disk_img/dimos.iso
            disk_img/dimos.img
            disk_img/FLOPPY2.img
            disk_img/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
