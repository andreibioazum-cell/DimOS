name: Build and validate DimOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dimos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate bootable images
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            binutils \
            dosfstools \
            mtools \
            nasm \
            qemu-system-x86 \
            python3-venv \
            xorriso \
            zip

      - name: Build PC profile
        run: |
          make clean
          make iso
          tools/release.sh pc

      - name: Validate PC profile
        run: make verify

      - name: Build emulator profile
        run: |
          make clean
          make emulator
          tools/release.sh emulator

      - name: Validate emulator profile
        run: make verify

      - name: Boot PC profile in QEMU
        run: |
          status=0
          timeout 10s qemu-system-x86_64 \
            -machine pc,accel=tcg -m 32M \
            -drive file=release/PC/dimos.hdd,format=raw,if=ide \
            -boot c -display none -serial none -monitor none \
            -no-reboot -no-shutdown -debugcon file:qemu-debug.log || status=$?
          test "$status" -eq 124
          grep -F "DIMOS:PROTECTED" qemu-debug.log
          grep -F "DIMOS:READY:VBE" qemu-debug.log

      # The sandbox runs the real kernel against a fake PC, so the phone
      # shell can be exercised (and screenshotted) on a build machine.
      - name: Phone shell smoke test
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet unicorn pillow
          /tmp/venv/bin/python tools/sandbox/run_kernel.py --build
          /tmp/venv/bin/python tools/sandbox/run_kernel.py --frames 30
          test -s tools/sandbox/out/kernel.bin
          test -s tools/sandbox/out/00-smoke.png
          file tools/sandbox/out/00-smoke.png

      # The 1.5K panel and the disk are the two things a build machine can
      # prove without hardware: the canvas has to scale into 2712x1220, and
      # files have to survive a reboot.
      - name: 1.5K display and disk test
        run: |
          /tmp/venv/bin/python tools/sandbox/run_kernel.py --display 2712x1220
          test -s tools/sandbox/out/display-2712x1220-home.png
          /tmp/venv/bin/python tools/sandbox/run_kernel.py --disk
          test -s tools/sandbox/out/26-reboot-load.png

      # The hosted runtime is the same kernel compiled as a normal program:
      # it gives PCs, tablets and phones the phone shell in a browser, and
      # runs Lua applications headless. Both are checked on the real code.
      - name: Build the hosted runtime
        run: ./build-anywhere.sh

      - name: Hosted shell self-test
        run: |
          ./bin/dimos-anywhere --disk bin/ci.hdd --shots bin/anywhere-shots \
            self-test
          test -s bin/anywhere-shots/01-lock-screen.png
          test -s bin/anywhere-shots/06-settings.png
          file bin/anywhere-shots/01-lock-screen.png

      - name: Lua applications without a GUI
        run: |
          ./bin/dimos-anywhere --disk bin/ci.hdd run HELLO.LUA
          ./bin/dimos-anywhere --disk bin/ci.hdd run SYSINFO.LUA
          ./bin/dimos-anywhere --disk bin/ci.hdd lua -e \
            'assert(#dim.file.list() > 0); print("lua sees the volume")'
          ./bin/dimos-anywhere --disk bin/ci.hdd apps

      # The phone folder is the same runtime cross compiled for AArch64 and
      # linked statically, so an ARM64 Android phone can start it as is.
      - name: Build the phone runtime (AArch64)
        run: |
          python3 -m venv /tmp/zig-venv
          /tmp/zig-venv/bin/pip install --quiet ziglang
          export PATH="/tmp/zig-venv/bin:$PATH"
          python-zig version
          ./build-anywhere.sh --target aarch64-linux-musl
          tools/release.sh phone
          test -s release/Phone/dimos-anywhere
          test -s release/Phone/dimos.hdd
          test -s release/Phone/fonts/font.ttf

      - name: Upload sandbox screenshots
        uses: actions/upload-artifact@v6
        with:
          name: DimOS-screenshots
          path: |
            tools/sandbox/out/*.png
            bin/anywhere-shots/*.png
          retention-days: 14

      - name: Create DimOS zip package
        run: |
          (cd release && zip -qr "../DimOS-${{ github.sha }}.zip" PC Emulator Phone)

      - name: Upload DimOS package
        uses: actions/upload-artifact@v6
        with:
          name: DimOS-${{ github.sha }}
          path: DimOS-${{ github.sha }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
